<!DOCTYPE html>
<html>
    <head>
        <title>TAB</title>
        <style>
            table {
                border-collapse: collapse;
                width: 100%;
            }
            td{
                border: 1px solid black;
                width: 50%;
                height: 100px;
                text-align: left;
                vertical-align: middle;
            }

        </style>
    </head>

   <body>
        <table>
            <tr>
                <td style="background-color: DarkOliveGreen;">First cell</td>
                <td style="background-color: LightPink;">Second cell</td>
        </tr>
    </table>
   </body>
</html>
