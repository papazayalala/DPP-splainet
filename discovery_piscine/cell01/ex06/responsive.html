<!DOCTYPE html>
<html>
    <head>
        <title>responsive</title>
        <style>
            html, body {
                height: 100%;
                width: 100%;
            }
            table {
                border-collapse: collapse;
                width: 100%;
                height: 100%;

            }
            td{
                border: 1px solid black;
                width: 20%;
                height: 100%;
                text-align: left;
                vertical-align: middle;
                text-align: center;
            }

        </style>
    </head>

   <body>
    
        <table>
            <tr>
                <td style="background-color: DarkOliveGreen;">First cell</td>
                <td style="background-color: LightPink;">Second cell</td>
                <td style="background-color: LightBlue;">Third cell</td>
                <td style="background-color: LightYellow;">Fourth cell</td>
                <td style="background-color: LightGray;">Fifth cell</td>
            </tr>
        </table>
    
   </body>
</html>
