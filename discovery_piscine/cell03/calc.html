<!DOCTYPE html>
<html>
<head>

    <title>Calculator</title>
    <link rel="stylesheet" href="calc.css">

</head>

<body>

    <div class="calculator">

        <input type="string" id="leftNum" placeholder="Left number">

        <select id="operator">
            <option value="+">+</option>
            <option value="-">-</option>
            <option value="*">*</option>
            <option value="/">/</option>
            <option value="%">%</option>
        </select>

        <input type="string" id="rightNum" placeholder="Right number">


        <input type="submit" id="btn" value="Try me!" onclick="calculate()">
    </div>

    <script src="calc.js"></script>
</body>
</html>
